syntax = "proto3";

package com.alflabs.milepostlib.trigger;

option java_multiple_files = true;

message PlaybackTriggerMetadata {
  bool include_in_cold_start = 1;

  float mp_min = 2;
  float mp_max = 3;
  PlaybackTriggerDirection mp_direction = 4;
  reserved 5; // for a future optional "enter_mp_range" boolean
}

enum PlaybackTriggerDirection {
  // Matches any direction, including unknown.
  DIRECTION_UNSPECIFIED = 0;
  // Matches only a known direction towards lower MP point.
  DIRECTION_TO_LOWER_MP = 1;
  // Matches only a known direction towards higher MP point.
  DIRECTION_TO_HIGHER_MP = 2;
}
