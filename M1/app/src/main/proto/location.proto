syntax = "proto3";

package com.alflabs.milepost.location;

option java_multiple_files = true;

message LocationDataList {
  repeated LocationData locations = 1;
}

message LocationData {
  LatLongData lat_long = 1;
  optional SpeedData speed = 2;
  optional float mp = 3;
  int32 flags = 4;
}

message LatLongData {
  int64 timestamp_millis = 1;
  double latitude = 2;
  double longitude = 3;
  optional float accuracy = 4;
}

message SpeedData {
  float speed_mps = 1;
  reserved 2;
  reserved "bearing_deg";
  optional float speed_acc = 3;
  reserved 4;
  reserved "bearing_acc";
}
